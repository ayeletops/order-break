<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work — ayeletops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400;1,6..96,900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Zilla+Slab:ital,wght@0,300;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/grids.css"><link rel="stylesheet" href="css/site.css">
<style>
  /* WORK — a horizontal CV. The column rhythm = gaps between 8 birth years: their years measure mine. */
  .nav{grid-template-columns:var(--work-intervals)}
  html,body{height:100%;overflow:hidden}
  .track-wrap{position:fixed;inset:calc(var(--nav-h) + var(--title-h, 124px)) 0 0 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  .track{position:relative;height:100%;width:calc(var(--years) * 14vw);min-width:300vw}
  .cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--reps),var(--work-intervals))}
  .cols div{border-left:2px solid var(--ink)}
  .axis{position:absolute;left:0;right:0;top:56%;border-top:8px solid var(--ink)}
  .yr{position:absolute;top:calc(56% + 8px);font:700 11px/1 var(--f-type);letter-spacing:.1em;transform:translateX(-50%)}
  .yr::before{content:"";position:absolute;left:50%;top:-14px;height:10px;border-left:2px solid var(--ink)}
  .e{position:absolute;bottom:calc(44% + 14px);width:clamp(220px,22vw,340px);transform:translateX(-1px);border-left:4px solid var(--ink);padding:0 0 0 12px;background:var(--paper)}
  .e:hover{outline:3px solid var(--signal);outline-offset:4px}
  .e.low{bottom:auto;top:calc(56% + 44px)}
  .e .when{font:700 11px/1 var(--f-type);letter-spacing:.1em;text-transform:uppercase}
  .e h3{margin:8px 0 6px;font:400 var(--s2)/1 var(--f-display)}
  .e p{margin:0 0 8px;font-size:13px;line-height:18px}
  .e a{text-decoration:none;border-bottom:2px solid var(--ink)}
  .e a:hover,.tools a:hover{outline:3px solid var(--signal);outline-offset:2px}
  .tools{display:flex;flex-wrap:wrap;gap:6px}
  .tools a{font:700 10px/1 var(--f-type);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink);padding:4px 6px}
  .hint{position:fixed;left:var(--margin-l);bottom:var(--gutter);z-index:3;margin:0;font:400 12px/18px var(--f-type);background:var(--paper);padding:2px 6px}
  .title{position:fixed;background:var(--paper);padding-right:12px;left:var(--margin-l);top:calc(var(--nav-h) + var(--baseline));z-index:3;margin:0;font:400 var(--s4)/.9 var(--f-display);pointer-events:none}
  .title em{display:block;font:400 13px/18px var(--f-type);font-style:normal;margin-top:12px;max-width:40ch}
</style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <a href="index.html">Cover</a>
  <a href="field.html">Latent Field</a>
  <a href="work.html" aria-current="page">Work</a>
  <span></span>
  <a href="holes.html" style="grid-column:span 2">Black Holes</a>
  <span class="handle">@ayeletops</span>
</nav>
<main>
  <header class="page-title st-row" id="title" aria-label="Work" style="--fs:90"></header>
  <p class="hint">Scroll sideways. Columns are spaced by the years between the people I love.</p>
  <div class="track-wrap" id="wrap">
    <div class="track" id="track" style="--years:20;--reps:3">
      <div class="cols"><!-- filled by script --></div>
      <div class="axis"></div>
      <div id="entries"></div>
    </div>
  </div>
</main>
<script src="js/stretch.js"></script>
<script>Stretch.make(document.getElementById('title'),'WORK',Stretch.weights('gaps'),{every:1500});</script>
<script>
/* CV entries. Only what the files show is filled in; everything else is marked to fill by Ayelet. */
const FROM = 2007, TO = 2027;
const ENTRIES = [
  { y: 2009, todo: true, when: '[year]', t: '[Studies]', d: '[degree, school — to fill]' },
  { y: 2013, todo: true, when: '[year]', t: '[First work]', d: '[role, place — to fill]', low: true },
  { y: 2017, todo: true, when: '2017?', t: '[Photography]', d: '[the 2017 Wix Photography folder — confirm what it was]' },
  { y: 2020, todo: true, when: '[years]', t: 'Wix', d: '[role — to fill]. Motion and video for product launches.', link: ['wix.com', 'https://www.wix.com'], low: true,
    tools: [['After Effects', 'https://www.adobe.com/products/aftereffects.html'], ['Premiere Pro', 'https://www.adobe.com/products/premiere.html'], ['Photoshop', 'https://www.adobe.com/products/photoshop.html']] },
  { y: 2025, when: '2025 →', t: 'M.Des, HIT', d: 'Design for Technology-Rich Environments. Biodesign, data, XR, AI.', link: ['hit.ac.il', 'https://www.hit.ac.il'],
    tools: [['Unity', 'https://unity.com'], ['Blender', 'https://www.blender.org'], ['ComfyUI', 'https://www.comfy.org'], ['Arduino', 'https://www.arduino.cc'], ['Cursor', 'https://cursor.com'], ['Claude', 'https://claude.ai']] },
];
const track = document.getElementById('track'), box = document.getElementById('entries');
const cols = track.querySelector('.cols'); const n = getComputedStyle(document.documentElement).getPropertyValue('--work-intervals').trim().split(/\s+/).length;
cols.innerHTML = '<div></div>'.repeat(n * 3);
const pos = y => ((y - FROM) / (TO - FROM) * 100) + '%';
for (let y = FROM; y <= TO; y++) box.insertAdjacentHTML('beforeend', `<span class="yr" style="left:${pos(y)}">${y}</span>`);
ENTRIES.forEach(e => box.insertAdjacentHTML('beforeend', `
  <article class="e ${e.low ? 'low' : ''} ${e.todo ? 'todo' : ''}" style="left:${pos(e.y)}">
    <div class="when">${e.when}</div><h3>${e.t}</h3><p>${e.d}</p>
    ${e.link ? `<p><a href="${e.link[1]}" target="_blank" rel="noopener">${e.link[0]} ↗</a></p>` : ''}
    ${e.tools ? `<div class="tools">${e.tools.map(([a, h]) => `<a href="${h}" target="_blank" rel="noopener">${a}</a>`).join('')}</div>` : ''}
  </article>`));
/* vertical wheel travels sideways on this page only */
const wrap = document.getElementById('wrap');
wrap.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { wrap.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
</script>
</body></html>
