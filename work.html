<style>
  /* WORK — the CV on the birthday grid. Each year takes one column of the uneven grid
     (column widths = gaps between 8 birth years, cycling). Time is not drawn to scale: it is drawn to their scale. */
  .page-head{border-bottom-color:var(--grid)}
  html,body{height:100%;overflow:hidden}
  .wrap{position:fixed;left:0;right:0;top:var(--content-top, 240px);bottom:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  .track{position:relative;height:100%}
  .col{position:absolute;top:0;bottom:0;border-left:var(--gw) solid var(--grid);pointer-events:none}
  .years{position:sticky;top:0;z-index:4;height:34px;background:var(--paper);border-bottom:var(--gw) solid var(--grid)}
  .years span{position:absolute;top:0;height:34px;display:flex;align-items:center;padding-left:6px;font:700 11px/1 var(--f-type);letter-spacing:.08em;border-left:var(--gw) solid var(--grid)}
  .cat{position:relative;height:var(--hc);border-bottom:var(--gw) solid var(--grid)}
  .track.grid .cat{height:var(--hg)}
  .role{top:var(--tc)}.track.grid .role{top:var(--tg)}
  .track.grid{height:var(--grid-h);min-height:100%}
  .wrap:has(.track.grid){overflow-y:auto}
  .cat h2{position:sticky;left:0;z-index:3;display:inline-block;margin:0;padding:10px 12px 10px var(--margin-l);background:var(--ink);color:var(--paper);
          font:700 11px/1 var(--f-type);letter-spacing:.14em;text-transform:uppercase}
  .cat h2 sup{font-weight:400;letter-spacing:0;margin-left:4px}
  .role{position:absolute;min-width:8px}
  .role{transform:translate(var(--ox,0),var(--oy,0)) rotate(var(--rot,0)) scale(var(--sc,1));transition:transform calc(var(--beat) * 2) var(--ease)}
  .track.grid .role{transform:none!important}
  /* CHAOS — another realm: a cork board. Index cards and polaroids pinned in layers, red string, a thin red circle at each event year. */
  /* the board: black. a map at night */
  .wrap:has(.track:not(.grid)){background:#0b0b0b}
  .track:not(.grid) .col,.track:not(.grid) .cat,.track:not(.grid) .years,.track:not(.grid) .years span{border-color:transparent;background:transparent}
  .track:not(.grid) .years span{color:#fff}
  .track:not(.grid) .cat h2{color:#2a1a0c}
  .track:not(.grid) .cat h2{background:#f3ead8;box-shadow:1px 2px 3px rgba(0,0,0,.35);transform:rotate(-1.5deg)}
  .track:not(.grid) .role{transform-origin:110px 16px;transform:translate(var(--ox,0),var(--oy,0)) rotate(var(--rot,0)) scale(var(--sc,1));cursor:pointer}
  .track:not(.grid) .role::after{display:none}
  .track:not(.grid) .role .bar{height:6px;background:var(--grid);width:min(100%,260px);opacity:.9}
  .track:not(.grid) .role .txt{background:#fbf8f1 repeating-linear-gradient(to bottom,transparent 0 21px,rgba(60,90,140,.18) 21px 22px) 0 34px/100% 100% no-repeat;
    border-top:2px solid rgba(229,51,42,.7);padding:10px 14px 14px;max-width:26ch;box-shadow:0 1px 1px rgba(0,0,0,.25),3px 6px 12px rgba(30,15,0,.35)}
  .track:not(.grid) .role h3{font:400 18px/1.15 "Special Elite",var(--f-type)}
  .track:not(.grid) .role .org{font:400 italic 15px/1.2 var(--f-display)}
  .track:not(.grid) .role .when{font:400 12px/1 "Special Elite",var(--f-type);color:var(--grid)}
  .track:not(.grid) .role::after{content:"";position:absolute;left:calc(50% - 7px);top:-8px;width:14px;height:14px;border-radius:50%;z-index:3;
    background:radial-gradient(circle at 35% 30%,#ff8a7a 0 18%,#e5332a 40%,#8c1410 100%);box-shadow:2px 3px 3px rgba(0,0,0,.45)}
  .chaos{position:absolute;inset:0;pointer-events:none;opacity:1;transition:opacity calc(var(--beat) * 2) var(--ease)}
  .track.grid .chaos{opacity:0}
  .chaos .ring{position:absolute;border-radius:50%;opacity:.22;background:repeating-radial-gradient(circle,transparent 0 14%,#fff 14% 14.6%);box-shadow:0 0 0 1px #fff inset}
  /* photographs on the board: printed, curled, glossy, shadowed */
  .ph{position:absolute;margin:0;pointer-events:auto;background:#fbfaf7;padding:7px;
      transform:perspective(900px) rotate(var(--r)) rotateX(var(--curl));cursor:pointer;
      box-shadow:0 1px 1px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.5),6px 16px 30px rgba(0,0,0,.65);transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
  .ph.pol{padding:9px 9px 42px}
  .ph > img:first-child{display:block;width:100%;height:auto}
  .ph.pol > img:first-child{aspect-ratio:1;object-fit:cover}
  .ph .sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.28),rgba(255,255,255,0) 32%,rgba(0,0,0,0) 62%,rgba(0,0,0,.12))}
  .ph:hover{transform:perspective(900px) rotate(calc(var(--r) * .6)) rotateX(0) scale(1.04);box-shadow:0 2px 2px rgba(0,0,0,.3),12px 30px 40px rgba(30,15,0,.45)}
  .ph.scan{background:none;padding:0;box-shadow:0 1px 1px rgba(0,0,0,.25),3px 8px 14px rgba(30,15,0,.4)}
  .ph.scan .sheen{opacity:.6}
  .ph.bl{background:none;padding:0;box-shadow:none}.ph.bl .sheen{display:none}
  .ph.bl.pol > img:first-child{aspect-ratio:auto}
  .ph.rt > img:first-child{filter:url(#rt)}
  .ph.rt.scan{background:#a3101a}
  .chaos canvas.strings{position:absolute;left:0;top:0;z-index:900;pointer-events:none}
  /* label tape: black embossed plastic, raised white capitals */
  .track:not(.grid) .cat h2{display:none}
  .dymo{position:absolute;pointer-events:auto;cursor:pointer;white-space:nowrap;padding:7px 14px 6px;transform:rotate(var(--r));
    font:700 15px/1 "Quicksand","Courier Prime",sans-serif;letter-spacing:.42em;text-transform:uppercase;color:rgba(255,255,255,.93);
    background:linear-gradient(180deg,#2b2b2b 0,#090909 22%,#111 50%,#050505 78%,#1c1c1c 100%);
    text-shadow:0 1px 0 rgba(0,0,0,.9),0 -1px 0 rgba(255,255,255,.18),0 0 1px rgba(255,255,255,.55);
    box-shadow:0 0 0 1px rgba(255,255,255,.22),2px 4px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(255,255,255,.06);
    clip-path:polygon(0 4%,100% 0,99.4% 100%,.6% 96%)}
  .dymo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.08) 45%,transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
  .dymo sup{font-size:.6em;letter-spacing:0;margin-left:-.2em;opacity:.8}
  /* arrows: under the paper, faint; a hovered thing brings its own up */
  /* threads: thin red lines over the paper; hovering a piece brightens its own */
  .chaos svg.topics{position:absolute;left:0;top:0;z-index:900;pointer-events:none;overflow:visible}
  .chaos svg.topics.hl{z-index:950}
  .chaos svg.topics path{fill:none;stroke:var(--grid);stroke-width:.55;stroke-opacity:.6;stroke-linecap:round}
  .chaos svg.topics.hl path{stroke-opacity:1;stroke-width:1}
  /* gallery: a print, brought to the front, full size; walk the board with the arrows */
  /* the print itself comes forward (it stays in the board's DOM); these are only the controls, in label tape */
  .ph.lifted,.ph.landing{transition:transform .7s var(--ease),box-shadow .7s var(--ease)}
  .ph.lifted{cursor:zoom-out;box-shadow:0 2px 3px rgba(0,0,0,.35),24px 50px 80px rgba(20,8,0,.55)}
  .gal{position:fixed;inset:0;z-index:2000;pointer-events:none}
  .gal[hidden]{display:none}
  .gal .cap{position:absolute;pointer-events:auto;margin:0;font:700 12px/1 "Quicksand",var(--f-type);letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.93);
    background:linear-gradient(180deg,#2b2b2b 0,#090909 22%,#111 50%,#050505 78%,#1c1c1c 100%);padding:8px 12px 7px 16px;border:0;box-shadow:2px 4px 6px rgba(20,8,0,.4);text-shadow:0 1px 0 #000,0 0 1px rgba(255,255,255,.5)}
  .gal .cap{left:50%;top:calc(var(--content-top,240px) + 44px);transform:translateX(-50%) rotate(.6deg);width:max-content;max-width:min(64ch,calc(100vw - 200px));font-size:10px;line-height:1.5;letter-spacing:.24em;text-align:center;pointer-events:none}
  .gal .cap:empty{display:none}
  .role .bar{height:10px;background:var(--ink);position:relative}
  /* the prism: a red after-image stays where the bar was and fades as it moves */
  .role .bar::before{content:"";position:absolute;inset:-1px;border:var(--gw) dashed var(--grid);opacity:0;pointer-events:none}
  .track.to-grid .role .bar::before{animation:stay-g calc(var(--beat) * 2) var(--ease) both}
  .track.to-chaos .role .bar::before{animation:stay-c calc(var(--beat) * 2) var(--ease) both}
  @keyframes stay-g{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--ox),var(--oy))}}
  @keyframes stay-c{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(calc(var(--ox) * -1),calc(var(--oy) * -1))}}
  .role .bar.open{background:linear-gradient(90deg,var(--ink) 75%,rgba(11,11,11,.15))}
  .role.point .bar{width:14px}
  .role .txt{position:relative;padding:6px 10px 0 0;width:max-content;max-width:30ch;background:var(--paper)}
  .role .when{font:700 11px/1 var(--f-type);letter-spacing:.08em}
  .role h3{margin:4px 0 1px;font:700 15px/1.12 var(--f-slab)}
  .role .org{font:400 italic 14px/1.15 var(--f-display)}
  .role .kit{margin-top:5px;padding-top:4px;border-top:var(--gw) solid currentColor;font:400 10px/1.5 var(--f-type);letter-spacing:.04em;text-transform:uppercase;opacity:.8;max-width:30ch}
  .role .kit a{border:0;text-decoration:none}.role .kit a:hover{text-decoration:underline}
  .role .kit i{font-style:normal;margin:0 .35em;opacity:.6}
  .track:not(.grid) .role .kit{font:400 11px/1.45 "Special Elite",var(--f-type);text-transform:none;letter-spacing:0;border-top-color:rgba(60,90,140,.35)}
  .role .more{position:absolute;left:0;top:100%;z-index:6;width:30ch;padding:8px 10px;background:var(--paper);border:var(--gw) solid var(--ink);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s,transform .3s}
  .role:hover{z-index:7}.role:hover .more{opacity:1;transform:none;pointer-events:auto}
  .role p{margin:0 0 4px;font:400 12px/17px var(--f-type)}
  .role a{text-decoration:none;border-bottom:var(--gw) solid var(--ink)}
  .role:hover .bar{outline:1px solid var(--grid);outline-offset:3px}
  .role a:hover,.tools a:hover,.filters button:hover{outline:1px solid var(--grid);outline-offset:2px}
</style>

<script>
/* From "Ayelet Sella CV May2026". Contact details intentionally left out. */
const FROM = 2005, TO = 2026, NOW = 2026.85;
const L = (t, h) => [t, h];
const CATS = [['edu', 'Education'], ['edit', 'Editing & post-production'], ['rest', 'Restoration'], ['finish', 'Finishing & colour'], ['ai', 'Video & AI'], ['prize', 'Recognition']];
const R = [
  { c: 'edu', a: 2005, b: 2006, t: 'Video Editing & Broadcast Design', o: 'Jumpcut', k: ['Avid', 'Premiere', 'After Effects'], d: 'Editing, VFX & animation school. [years to confirm]' },
  { c: 'edu', a: 2006, b: 2008, t: 'B.Des, Motion Graphics', o: 'Shenkar College of Engineering, Design and Art', k: ['After Effects', 'Cinema 4D'], d: '[years to confirm]' },
  { c: 'edu', a: 2025, b: NOW, open: true, t: 'M.Des, Design for Technology-Rich Environments', o: 'HIT, Holon Institute of Technology', k: ['Figma', 'Unity', 'Claude Code & Cowork', 'GitHub'], d: 'In progress.', link: L('hit.ac.il', 'https://www.hit.ac.il') },
  { c: 'edit', a: 2008, b: 2009, t: 'Assistant Editor', o: '2Shot Films', k: ['Avid'], d: 'Documentaries.' },
  { c: 'edit', a: 2009, b: 2018, t: 'Freelance Video Editor & Post-Production Consultant', o: 'Broadcast & agencies', k: ['Avid', 'Premiere', 'After Effects'], d: 'Reshet, Keshet, Channel 10, Ananey, Greenhouse, Snowball Studios, McCann. From story, structure and pacing to finishing.' },
  { c: 'rest', a: 2013, b: 2013.95, t: 'Analog Film Archive Restoration', o: 'Israel PBS', k: ['DaVinci Resolve'], d: 'Project.' },
  { c: 'rest', a: 2013.95, b: 2014.95, t: 'Digital Restoration Specialist', o: 'Realworks Studios', k: ['DaVinci Resolve'], d: 'Frame-by-frame repair of archival film. The Decent One (2014).' },
  { c: 'finish', a: 2014, b: 2018, t: 'Conform & Color Grading', o: 'Opus Post Productions', k: ['DaVinci Resolve', 'Avid'], d: 'Online conform, finishing, mastering and DCP. Abulele (2015), Sirens (2014), Absentia (2017), Survivor Israel, Gidi & Aharoni.' },
  { c: 'ai', a: 2018, b: NOW, open: true, t: 'Video Specialist', o: 'Wix.com', k: ['Weavy', 'Freepik', 'Kling', 'Higgsfield', 'ElevenLabs', 'Topaz Labs', 'Colourlab AI', 'Premiere', 'After Effects', 'Frame.io', 'monday.com', 'Slack', 'Google Workspace'], d: 'Quality control, workflows and delivery for editorial, marketing and educational video. AI video R&D, folding generative tools into production.', link: L('wix.com', 'https://www.wix.com') },
  { c: 'prize', a: 2025, b: 2025, point: true, t: '1st place, Design Guild AI Hackathon', o: 'Wix', k: ['Deepgram', 'Whisper', 'Claude Code & Cowork'], d: 'Deepgram, Whisper, ComfyUI, several LLMs and video generation engines.' },
];
const TOOLS = [
  ['Generative AI', [L('Weavy', 'https://www.weavy.ai'), L('Freepik', 'https://www.freepik.com'), L('Kling', 'https://klingai.com'), L('Higgsfield', 'https://higgsfield.ai'), L('ElevenLabs', 'https://elevenlabs.io')]],
  ['Other AI', [L('Topaz Labs', 'https://www.topazlabs.com'), L('Colourlab AI', 'https://colourlab.ai'), L('Deepgram', 'https://deepgram.com'), L('Whisper', 'https://openai.com/research/whisper'), L('Claude Code & Cowork', 'https://claude.ai')]],
  ['Editing & colour', [L('Avid', 'https://www.avid.com'), L('Premiere', 'https://www.adobe.com/products/premiere.html'), L('DaVinci Resolve', 'https://www.blackmagicdesign.com/products/davinciresolve')]],
  ['Motion, 3D & design', [L('After Effects', 'https://www.adobe.com/products/aftereffects.html'), L('Cinema 4D', 'https://www.maxon.net/cinema-4d'), L('Unity', 'https://unity.com'), L('Figma', 'https://www.figma.com')]],
  ['Collaboration & dev', [L('Frame.io', 'https://frame.io'), L('monday.com', 'https://monday.com'), L('Slack', 'https://slack.com'), L('Google Workspace', 'https://workspace.google.com'), L('GitHub', 'https://github.com')]],
];
const TOOL = Object.fromEntries(TOOLS.flatMap(([, ts]) => ts));
// ── the grid: one column per year; widths cycle through the gaps between the 8 birth years
const gaps = getComputedStyle(document.documentElement).getPropertyValue('--work-intervals').trim().split(/\s+/).map(parseFloat);
const years = []; for (let y = FROM; y <= TO; y++) years.push(y);
const COL = 200;                                              // classic: every year the same width
const widths = years.map(() => COL);
const starts = widths.reduce((acc, w, i) => (acc.push(i ? acc[i - 1] + widths[i - 1] : 0), acc), []);
const X = y => { const i = Math.min(years.length - 1, Math.max(0, Math.floor(y) - FROM)); return starts[i] + (y - Math.floor(y)) * widths[i]; };
const total = starts[starts.length - 1] + widths[widths.length - 1], LEFT = 240, TOOLBOX_W = 160, YEARS_H = 34;
const track = document.getElementById('track'), wrapEl = document.getElementById('wrap');
const OFF = (window.PLACEMENT && PLACEMENT.offsets) || [[0, 0]];
const face = i => { const f = Stretch.FACES[(i * 7 + 3) % Stretch.FACES.length]; return `--face:'${f.f}';--fw:${f.w};--fst:${f.s}`; };   // ransom-note titles
function build() {
  let OI = 0; Board.reset();
  const avail = wrapEl.clientHeight - YEARS_H, rowH = Math.max(70, Math.floor(avail / CATS.length));   // the board (to be)
  const LANES = CATS.map(([k]) => { const lanes = []; R.filter(r => r.c === k).sort((a, b) => a.a - b.a).forEach(r => { const x0 = X(r.a);
    let li = lanes.findIndex(e => e <= x0); if (li < 0) { li = lanes.length; lanes.push(0); } lanes[li] = Math.max(r.point ? x0 + 14 : X(r.b), x0 + 290) + 16; r._lane = li; }); return Math.max(1, lanes.length); });
  const UNIT = Math.max(128, Math.floor(avail / LANES.reduce((s, n) => s + n, 0)));                      // the grid (not to be): one lane = one card, never less than a card is tall
  track.style.width = (LEFT + total + TOOLBOX_W) + 'px';
  track.style.setProperty('--grid-h', (YEARS_H + LANES.reduce((s, n) => s + n * UNIT, 0) + 12) + 'px');
  let h = `<div class="years">` + years.map((y, i) => `<span style="left:${LEFT + starts[i]}px;width:${widths[i]}px">${y}</span>`).join('') + `</div>`;
  years.forEach((y, i) => h += `<div class="col" style="left:${LEFT + starts[i]}px"></div>`);
  const CENT = [], TAGS = [];
  CATS.forEach(([k, name], ci) => {
    const tag = { k, name, n: 0, pts: [] }; TAGS.push(tag);
    const items = R.filter(r => r.c === k).sort((a, b) => a.a - b.a); let inner = '';
    const laneH = rowH / LANES[ci];
    items.forEach(r => {
      const x0 = X(r.a), x1 = r.point ? x0 + 10 : X(r.b);
      const when = r.point ? `${r.a}` : `${Math.floor(r.a)}${Math.floor(r.b) > Math.floor(r.a) || r.open ? '–' + (r.open ? 'now' : Math.floor(r.b)) : ''}`;
      const o = OFF[(OI++) % OFF.length], o2 = OFF[(OI * 5 + 11) % OFF.length];
      const ox = Math.round(o[0] * 340), oy = Math.round(o[1] * rowH * 1.5), rot = (o2[0] * 13).toFixed(1), sc = (1 + o2[1] * .3).toFixed(2);   // the people throw it
      CENT.push([LEFT + x0 + 110 + ox, YEARS_H + ci * rowH + 12 + r._lane * laneH + 16 + oy]);   // the pin (card top)
      tag.pts.push(CENT[CENT.length - 1]); tag.n++;
      inner += `<article class="role ${r.point ? 'point' : ''}" data-id="c${CENT.length - 1}" style="left:${LEFT + x0}px;width:${x1 - x0}px;--tc:${12 + r._lane * laneH}px;--tg:${10 + r._lane * UNIT}px;--ox:${ox}px;--oy:${oy}px;--rot:${rot}deg;--sc:${sc};--depth:${(.5 + Math.abs(o2[0]) * 1.2).toFixed(2)};z-index:${31 + (OI % 7)}">
        <div class="bar ${r.open ? 'open' : ''}"></div>
        <div class="txt"><div class="when">${when}</div><h3>${r.t}</h3><div class="org">${r.o}</div>${r.k ? `<div class="kit">${r.k.map(n => TOOL[n] ? `<a href="${TOOL[n]}" target="_blank" rel="noopener">${n}</a>` : n).join('<i>·</i>')}</div>` : ''}
          <div class="more"><p>${r.d}</p>${r.link ? `<p><a href="${r.link[1]}" target="_blank" rel="noopener">${r.link[0]} ↗</a></p>` : ''}</div></div></article>`;
    });
    h += `<section class="cat" data-cat="${k}" style="--hc:${rowH}px;--hg:${LANES[ci] * UNIT}px"><h2>${name}<sup>${items.length}</sup></h2>${inner}</section>`;
  });
  // chaos layer: black targets at the event years, the paper, the label tape, the tools, and thin lines between things that belong together
  const W2 = LEFT + total + TOOLBOX_W, Hh = wrapEl.clientHeight;
  const rings = Rupture.YEARS.map((y, i) => { const R = Hh * [.2, .27, .17, .23, .3][i], o = OFF[(i * 9 + 4) % OFF.length], cx = LEFT + X(y + .5), cy = YEARS_H + avail * (.5 + o[1] * .22);
    return `<i class="ring" style="left:${cx - R}px;top:${cy - R}px;width:${R * 2}px;height:${R * 2}px"></i>`; }).join('');
  const B = Board.build({ OFF, left: LEFT + 20, width: total + TOOLBOX_W - 60, top: YEARS_H + 10, height: avail - 20 });
  // what each part of the CV is about, so the lines can find its kin on the board
  const nodes = B.anchors.slice();
  TAGS.forEach(t => t.pts.forEach(p => nodes.push([p[0], p[1] + 34, 220, 'cv:' + t.k, 'card', 'c' + CENT.indexOf(p), 240, 96])));
  // the categories leave their rows: embossed label tape stuck on the board near their cards
  const dymo = TAGS.map((t, i) => { const o = OFF[(i * 17 + 9) % OFF.length], cx = t.pts.reduce((s, p) => s + p[0], 0) / Math.max(1, t.pts.length);
    const x = cx + o[0] * 260 - 60, y = YEARS_H + 40 + Math.abs(o[1]) * (avail - 120), r = (o[0] * 9).toFixed(1);
    const tw = 36 + (t.name.length + 1) * 13; nodes.push([x + tw / 2, y + 14, 200, 'cv:' + t.k, 'tag', 't' + i, tw, 30]);
    return `<span class="dymo" data-id="t${i}" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;--r:${r}deg;z-index:${30 + i}">${t.name}<sup>${t.n}</sup></span>`; }).join('');
  h += `<div class="chaos">${rings}${B.html}${dymo}${Board.lines(nodes, W2, Hh, OFF)}</div>`;
  track.innerHTML = h;
}
build(); new ResizeObserver(build).observe(wrapEl); Board.front(track);
const wrap = document.getElementById('wrap');
// to be (chaos) / not to be (the grid)
document.querySelectorAll('.views [data-v]').forEach(b => b.addEventListener('click', () => {
  const chaos = b.dataset.v === 'chaos', tr = document.getElementById('track'); if (chaos === !tr.classList.contains('grid')) return;   // already there
  document.querySelectorAll('.views [data-v]').forEach(x => x.setAttribute('aria-pressed', x === b));
  tr.classList.remove('to-grid', 'to-chaos'); void tr.offsetWidth; tr.classList.add(chaos ? 'to-chaos' : 'to-grid'); tr.classList.toggle('grid', !chaos);
}));
wrap.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { wrap.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
</script>
