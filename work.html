<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work — ayeletops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Permanent+Marker&family=VT323&family=Alfa+Slab+One&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400;1,6..96,900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Zilla+Slab:ital,wght@0,300;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/grids.css?v=202611161309"><link rel="stylesheet" href="css/site.css?v=202611161309">
<style>
  /* WORK — the CV on the birthday grid. Each year takes one column of the uneven grid
     (column widths = gaps between 8 birth years, cycling). Time is not drawn to scale: it is drawn to their scale. */
  .page-head{border-bottom-color:var(--grid)}
  html,body{height:100%;overflow:hidden}
  .wrap{position:fixed;left:0;right:0;top:var(--content-top, 240px);bottom:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  .track{position:relative;height:100%}
  .col{position:absolute;top:0;bottom:0;border-left:var(--gw) solid var(--grid);pointer-events:none}
  .years{position:sticky;top:0;z-index:4;height:34px;background:var(--paper);border-bottom:var(--gw) solid var(--grid)}
  .years span{position:absolute;top:0;height:34px;display:flex;align-items:center;padding-left:6px;font:700 11px/1 var(--f-type);letter-spacing:.08em;border-left:var(--gw) solid var(--grid)}
  .cat{position:relative;border-bottom:var(--gw) solid var(--grid)}
  .cat h2{position:sticky;left:0;z-index:3;display:inline-block;margin:0;padding:10px 12px 10px var(--margin-l);background:var(--ink);color:var(--paper);
          font:700 11px/1 var(--f-type);letter-spacing:.14em;text-transform:uppercase}
  .cat h2 sup{font-weight:400;letter-spacing:0;margin-left:4px}
  .role{position:absolute;min-width:8px}
  .role{transform:translate(var(--ox,0),var(--oy,0)) rotate(var(--rot,0)) scale(var(--sc,1));transition:transform calc(var(--beat) * 2) var(--ease)}
  .track.grid .role{transform:none!important}
  /* CHAOS — another realm: a cork board. Index cards and polaroids pinned in layers, red string, a thin red circle at each event year. */
  .wrap:has(.track:not(.grid))[style*='--cork']{background:var(--cork) 0 0/520px auto repeat!important}
  .wrap:has(.track:not(.grid)){background-color:#b4875a;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='3' seed='9'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .2  0 0 0 0 .1  0 0 0 -2.2 1.35'/></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='d'><feTurbulence type='fractalNoise' baseFrequency='.09' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .16  0 0 0 -1.8 .9'/></filter><rect width='100%' height='100%' filter='url(%23d)'/></svg>");
    box-shadow:inset 0 0 120px rgba(40,20,5,.45)}
  .track:not(.grid) .col,.track:not(.grid) .cat,.track:not(.grid) .years,.track:not(.grid) .years span{border-color:transparent;background:transparent}
  .track:not(.grid) .years span,.track:not(.grid) .cat h2{color:#2a1a0c}
  .track:not(.grid) .cat h2{background:#f3ead8;box-shadow:1px 2px 3px rgba(0,0,0,.35);transform:rotate(-1.5deg)}
  .track:not(.grid) .role{z-index:12;transform:translate(var(--ox,0),var(--oy,0)) rotate(var(--rot,0)) scale(var(--sc,1)) translate(calc(var(--px,0) * var(--depth,1)),calc(var(--py,0) * var(--depth,1)))}
  .track:not(.grid) .role .bar{height:6px;background:var(--grid);width:min(100%,260px);opacity:.9}
  .track:not(.grid) .role .txt{background:#fbf8f1 repeating-linear-gradient(to bottom,transparent 0 21px,rgba(60,90,140,.18) 21px 22px) 0 34px/100% 100% no-repeat;
    border-top:2px solid rgba(229,51,42,.7);padding:10px 14px 14px;max-width:26ch;box-shadow:0 1px 1px rgba(0,0,0,.25),3px 6px 12px rgba(30,15,0,.35)}
  .track:not(.grid) .role h3{font:400 18px/1.15 "Special Elite",var(--f-type)}
  .track:not(.grid) .role .org{font:400 italic 15px/1.2 var(--f-display)}
  .track:not(.grid) .role .when{font:400 12px/1 "Special Elite",var(--f-type);color:var(--grid)}
  .track:not(.grid) .role::after{content:"";position:absolute;left:calc(50% - 7px);top:-8px;width:14px;height:14px;border-radius:50%;z-index:3;
    background:radial-gradient(circle at 35% 30%,#ff8a7a 0 18%,#e5332a 40%,#8c1410 100%);box-shadow:2px 3px 3px rgba(0,0,0,.45)}
  .chaos{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:1;transition:opacity calc(var(--beat) * 2) var(--ease)}
  .track.grid .chaos{opacity:0}
  .chaos .ring{position:absolute;border-radius:50%;opacity:.9;background:repeating-radial-gradient(circle,transparent 0 14%,#0b0b0b 14% 15.2%);box-shadow:0 0 0 2px #0b0b0b inset;mix-blend-mode:multiply}
  .chaos .pol-old{position:absolute;background:#fbfaf6;padding:8px 8px 34px;box-shadow:0 1px 1px rgba(0,0,0,.25),4px 8px 16px rgba(30,15,0,.4);
    transform:rotate(var(--r)) translate(calc(var(--px,0) * var(--depth,1)),calc(var(--py,0) * var(--depth,1)));pointer-events:auto}
  .chaos .pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1) contrast(1.08)}
  .chaos .pol span{position:absolute;left:10px;right:10px;bottom:9px;font:400 13px/1.2 "Special Elite",var(--f-type);color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chaos .pol::after{content:"";position:absolute;left:calc(50% - 7px);top:-7px;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff8a7a 0 18%,#e5332a 40%,#8c1410 100%);box-shadow:2px 3px 3px rgba(0,0,0,.45)}
  /* photographs on the board: printed, curled, glossy, shadowed */
  .ph{position:absolute;margin:0;pointer-events:auto;background:#fbfaf7;padding:7px;
      transform:perspective(900px) rotate(var(--r)) rotateX(var(--curl)) translate(calc(var(--px,0) * var(--depth,1)),calc(var(--py,0) * var(--depth,1)));
      box-shadow:0 1px 1px rgba(0,0,0,.28),0 4px 8px rgba(30,15,0,.22),6px 16px 26px rgba(30,15,0,.38);transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
  .ph.pol{padding:9px 9px 42px}
  .ph > img:first-child{display:block;width:100%;height:auto}
  .ph.pol > img:first-child{aspect-ratio:1;object-fit:cover}
  .ph .sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.28),rgba(255,255,255,0) 32%,rgba(0,0,0,0) 62%,rgba(0,0,0,.12))}
  .ph:hover{z-index:80!important;transform:perspective(900px) rotate(0) rotateX(0) scale(1.12);box-shadow:0 2px 2px rgba(0,0,0,.3),12px 30px 40px rgba(30,15,0,.45)}
  .ph .pin{position:absolute;left:calc(50% - 9px);top:-6px;width:18px;height:18px;border-radius:50%;z-index:3;
    background:radial-gradient(circle at 34% 28%,#fff 0 7%,#ff7b6b 12%,#d8261a 38%,#7d0e08 74%,#3a0503 100%);box-shadow:3px 6px 5px rgba(0,0,0,.45)}
  .ph img.pin.img{width:34px;height:auto;left:calc(50% - 12px);top:-18px;border-radius:0;background:none;box-shadow:none;filter:drop-shadow(3px 6px 4px rgba(0,0,0,.45))}
  .chaos .strings .tw-hi2{fill:none;stroke:#5e0a06;stroke-width:.7;stroke-dasharray:.8 3.2;stroke-dashoffset:2;opacity:.8}
  /* the board's scraps */
  .sc{position:absolute;pointer-events:auto;transform:rotate(var(--r)) scale(var(--s,1)) translate(calc(var(--px,0) * var(--depth,1)),calc(var(--py,0) * var(--depth,1)));transition:transform .4s var(--ease)}
  .sc.print,.sc.duo,.sc.cam{clip-path:var(--cut,none)}
  /* xerox: crushed photocopy contrast + halftone dots */
  .sc.print img,.sc.pol img{filter:grayscale(1) contrast(2.1) brightness(1.08)}
  .sc.print::after,.sc.pol::after{content:"";position:absolute;inset:6px;pointer-events:none;mix-blend-mode:multiply;opacity:.35;background:radial-gradient(#000 .9px,transparent 1.2px) 0 0/4px 4px}
  /* camcorder frames: scanlines, colour fringe, REC, date stamp */
  .sc.cam{background:#000;padding:0;box-shadow:3px 5px 12px rgba(0,0,0,.55)}
  .sc.cam img{display:block;width:100%;filter:grayscale(.2) contrast(1.4) saturate(1.6) hue-rotate(-12deg) drop-shadow(2px 0 0 rgba(255,0,80,.7)) drop-shadow(-2px 0 0 rgba(0,220,255,.6))}
  .sc.cam::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.35) 0 1px,transparent 1px 3px);pointer-events:none}
  .sc.cam b,.sc.cam em,.sc.cam i{position:absolute;font:400 18px/1 "VT323",monospace;color:#fff;text-shadow:0 0 4px rgba(255,255,255,.7);z-index:2;font-style:normal}
  .sc.cam b{left:10px;top:8px;color:#ff3b3b}.sc.cam em{right:10px;bottom:8px;color:#ffae2b}.sc.cam i{left:10px;bottom:8px}
  /* day-glo duotones and stickers */
  .sc.duo{padding:0;box-shadow:2px 4px 10px rgba(0,0,0,.4)}
  .sc.duo img{mix-blend-mode:multiply;filter:grayscale(1) contrast(2)}
  .sc.duo.d0{background:#ff2fb3}.sc.duo.d1{background:#f4ff3a}.sc.duo.d2{background:#39ff7a}
  .sc.glo{border-radius:50%;display:grid;place-items:center;font:400 22px/1 "Alfa Slab One",serif;text-align:center;box-shadow:2px 3px 0 #111;border:3px solid #111}
  .sc.glo.g0{background:#ff2fb3;color:#111}.sc.glo.g1{background:#f4ff3a;color:#111}.sc.glo.g2{background:#39ff7a;color:#111;border-radius:12px}
  .sc.static{background:#000;padding:10px 10px 28px;border-radius:14px;box-shadow:inset 0 0 18px rgba(255,255,255,.35),3px 5px 10px rgba(0,0,0,.5)}
  .sc.static canvas{width:100%;height:100%;display:block;border-radius:30% / 20%;filter:contrast(1.4)}
  .sc.ring{border-radius:50%;box-shadow:inset 0 0 0 7px rgba(110,62,20,.32),inset 0 0 0 9px rgba(110,62,20,.12);pointer-events:none}
  .sc.staple{background:linear-gradient(#aaa,#eee 40%,#888);border-radius:2px;box-shadow:1px 1px 1px rgba(0,0,0,.4);pointer-events:none}
  .sc.scrib{pointer-events:none}.sc.scrib svg{width:100%;height:100%;overflow:visible}
  .sc.scrib path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .sc.scrib.s0 path{stroke:#e5332a}.sc.scrib.s1 path{stroke:#111}.sc.scrib.s2 path{stroke:#ff2fb3}
  .sc.marker.m2{font-size:30px;color:#e5332a;transform:rotate(calc(var(--r) * 1.4)) scale(var(--s,1))}
  .sc:hover{z-index:60!important;transform:rotate(0deg) scale(1.08)}
  .sc.pol{background:#fbfaf6;padding:8px 8px 34px;box-shadow:0 1px 1px rgba(0,0,0,.25),4px 8px 16px rgba(30,15,0,.4)}
  .sc.print{background:#fff;padding:6px;box-shadow:2px 4px 10px rgba(30,15,0,.45)}
  .sc img{display:block;width:100%;height:auto;filter:grayscale(1) contrast(1.1)}
  .sc.pol img{aspect-ratio:1;object-fit:cover}
  .sc span{position:absolute;left:10px;right:10px;bottom:9px;font:400 13px/1.2 "Special Elite",var(--f-type);color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sc.print span{position:static;display:block;padding-top:4px}
  .sc.strip{background:#111;padding:14px 8px;display:flex;gap:6px;box-shadow:2px 4px 8px rgba(0,0,0,.5);
    background-image:repeating-linear-gradient(90deg,#efe9dc 0 7px,transparent 7px 16px),repeating-linear-gradient(90deg,#efe9dc 0 7px,transparent 7px 16px);
    background-size:100% 6px,100% 6px;background-position:0 4px,0 calc(100% - 4px);background-repeat:no-repeat}
  .sc.strip i{flex:1;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.2);border-radius:2px}
  .sc.ticket{background:#e5332a;color:#fff;padding:10px 14px;font:700 11px/1.3 var(--f-type);letter-spacing:.12em;box-shadow:2px 3px 6px rgba(0,0,0,.35);
    -webkit-mask:radial-gradient(circle 6px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 6px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
  .sc.ticket b{display:block;font:400 22px/1 "Alfa Slab One",serif;letter-spacing:.02em}
  .sc.ticket em{display:block;font-style:normal;margin-top:4px}.sc.ticket small{opacity:.85}
  .sc.leader svg{width:100%;height:100%;filter:drop-shadow(2px 3px 3px rgba(0,0,0,.4))}
  .sc.leader circle,.sc.leader path{fill:none;stroke:#111;stroke-width:2}
  .sc.leader circle:first-child{fill:#f4efe4}
  .sc.leader text{font:900 46px "Bodoni Moda",serif;text-anchor:middle;fill:#111}
  .sc.edl{background:#f7f5ee repeating-linear-gradient(to bottom,transparent 0 15px,rgba(120,170,120,.18) 15px 30px);padding:10px 12px;box-shadow:2px 4px 10px rgba(30,15,0,.4);
    border-left:10px dotted rgba(0,0,0,.18);border-right:10px dotted rgba(0,0,0,.18)}
  .sc.edl pre{margin:0;font:400 10px/15px "Courier Prime",monospace;color:#222;white-space:pre}
  .sc.sticky{background:#ffe55a;display:grid;place-items:center;box-shadow:1px 3px 5px rgba(0,0,0,.3);font:400 22px/1 "Permanent Marker",cursive;color:#222}
  .sc.sticky.y2{background:#9fd8ef}
  .sc.ransom{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
  .sc.ransom b{display:inline-block;background:#fff;color:#111;padding:2px 4px;font-size:26px;line-height:1;box-shadow:1px 2px 2px rgba(0,0,0,.3)}
  .sc.ransom b.inv{background:#111;color:#fff}
  .sc.ransom .sp{width:10px}
  .sc.marker{font:400 24px/1.05 "Permanent Marker",cursive;color:#111;text-shadow:0 0 1px rgba(0,0,0,.3)}
  .sc.tape{opacity:.82;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .sc.tape.t0{background:repeating-linear-gradient(45deg,#111 0 8px,#e9c9c0 8px 16px)}
  .sc.tape.t1{background:repeating-linear-gradient(45deg,#c9a39a 0 6px,#f3e7df 6px 12px)}
  .sc.tape.t2{background:rgba(250,250,240,.7);border-left:1px dashed rgba(0,0,0,.25);border-right:1px dashed rgba(0,0,0,.25)}
  .sc.vhs{background:#fff;border-top:10px solid #111;padding:6px 10px;font:400 16px/1.1 "Permanent Marker",cursive;box-shadow:2px 4px 8px rgba(0,0,0,.4)}
  .sc.vhs em{display:block;font:700 10px/1.4 var(--f-type);font-style:normal;letter-spacing:.1em}
  .sc.cassette{background:#1b1b1b;border-radius:8px;padding:12px;box-shadow:3px 5px 10px rgba(0,0,0,.5)}
  .sc.cassette .cl{background:#f3eee2;padding:6px 8px;font:400 14px/1.1 "Permanent Marker",cursive;height:40px}
  .sc.cassette .cw{display:flex;justify-content:space-around;margin-top:16px}
  .sc.cassette .cw i{width:46px;height:46px;border-radius:50%;border:8px solid #f3eee2;background:#1b1b1b;box-shadow:inset 0 0 0 6px #444}
  .sc.pass{background:#fff;border:2px solid #111;padding:10px;font:700 12px/1.2 var(--f-type);letter-spacing:.1em;box-shadow:2px 4px 10px rgba(0,0,0,.35);text-align:center}
  .sc.pass b{display:block;background:#e5332a;color:#fff;padding:4px 0}
  .sc.pass em{display:block;font:400 18px/1.3 "Permanent Marker",cursive;margin:8px 0}
  .sc.pass strong{display:block;font:400 44px/1 "Alfa Slab One",serif;color:#e5332a}
  .sc.pass.p2 b{background:#111}
  .sc.poi{background:#f6f2e6;padding:10px 12px 12px;box-shadow:2px 5px 12px rgba(30,15,0,.45);border:1px solid #222;font:400 12px/1.35 "Courier Prime",monospace}
  .sc.poi .tag{display:block;background:#111;color:#fff;font:700 9px/1 var(--f-type);letter-spacing:.14em;padding:4px 6px;margin:-10px -12px 8px}
  .sc.poi .sil{width:96px;height:104px;margin:0 auto 6px;background:#d8d2c4;border:1px solid #222}.sc.poi .sil svg{width:100%;height:100%;fill:#3a3a3a}
  .sc.poi strong{display:block;font:400 20px/1 "Special Elite",var(--f-type);margin-bottom:4px}
  .sc.poi small{display:block}.sc.poi em{display:block;margin-top:6px;font:400 16px/1.1 "Permanent Marker",cursive;color:#e5332a;font-style:normal}
  .sc.ticket strong{display:block;font:400 17px/1.05 "Alfa Slab One",serif;margin:3px 0}
  .sc.ticket.tk2{background:#f4ff3a;color:#111}
  .sc.tv{background:#fff;padding:8px 10px;box-shadow:2px 4px 8px rgba(0,0,0,.35);font:400 11px/1.3 "Courier Prime",monospace;border-top:3px double #111}
  .sc.tv small{font-weight:700;letter-spacing:.14em}.sc.tv b{display:block;font:900 22px/1 "Bodoni Moda",serif}.sc.tv em{font-style:normal}
  .sc.curtain{box-shadow:3px 5px 10px rgba(0,0,0,.5);background:repeating-linear-gradient(90deg,#5c0a06 0 6px,#a3150c 12px,#d2281a 16px,#a3150c 20px,#5c0a06 26px)}
  .sc.zig{box-shadow:3px 5px 10px rgba(0,0,0,.5);background:linear-gradient(135deg,#111 25%,transparent 25%) -14px 0/28px 28px,linear-gradient(225deg,#111 25%,transparent 25%) -14px 0/28px 28px,linear-gradient(315deg,#111 25%,transparent 25%) 0 0/28px 28px,linear-gradient(45deg,#111 25%,#f2efe6 25%) 0 0/28px 28px}
  .sc.corridor{background:#f2efe6;box-shadow:2px 4px 10px rgba(0,0,0,.45)}.sc.corridor svg{width:100%;height:100%}.sc.corridor rect,.sc.corridor path{fill:none;stroke:#111;stroke-width:1.5}
  .chaos svg.strings{position:absolute;left:0;top:0;overflow:visible;z-index:20}
  /* twine: a dark core, a spiralling highlight (the twist), a soft cast shadow, knots at the pins */
  .chaos .strings .tw{fill:none;stroke:#a8160f;stroke-width:2.4;stroke-linecap:round}
  .chaos .strings .tw-hi{fill:none;stroke:#ff6a55;stroke-width:1.1;stroke-dasharray:1.6 2.4;stroke-linecap:round;opacity:.9}
  .chaos .strings .tw-sh{fill:none;stroke:rgba(40,18,4,.32);stroke-width:2.6;filter:blur(1.2px)}
  .chaos .strings .knot{fill:#8c1410}
  .role .bar{height:10px;background:var(--ink);position:relative}
  /* the prism: a red after-image stays where the bar was and fades as it moves */
  .role .bar::before{content:"";position:absolute;inset:-1px;border:var(--gw) dashed var(--grid);opacity:0;pointer-events:none}
  .track.to-grid .role .bar::before{animation:stay-g calc(var(--beat) * 2) var(--ease) both}
  .track.to-chaos .role .bar::before{animation:stay-c calc(var(--beat) * 2) var(--ease) both}
  @keyframes stay-g{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--ox),var(--oy))}}
  @keyframes stay-c{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(calc(var(--ox) * -1),calc(var(--oy) * -1))}}
  .role .bar.open{background:linear-gradient(90deg,var(--ink) 75%,rgba(11,11,11,.15))}
  .role.point .bar{width:14px}
  .role .txt{position:relative;padding:6px 10px 0 0;width:max-content;max-width:30ch;background:var(--paper)}
  .role .when{font:700 11px/1 var(--f-type);letter-spacing:.08em}
  .role h3{margin:4px 0 1px;font:700 15px/1.12 var(--f-slab)}
  .role .org{font:400 italic 14px/1.15 var(--f-display)}
  .role .more{position:absolute;left:0;top:100%;z-index:6;width:30ch;padding:8px 10px;background:var(--paper);border:var(--gw) solid var(--ink);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s,transform .3s}
  .role:hover{z-index:7}.role:hover .more{opacity:1;transform:none;pointer-events:auto}
  .role p{margin:0 0 4px;font:400 12px/17px var(--f-type)}
  .role a{text-decoration:none;border-bottom:var(--gw) solid var(--ink)}
  .role:hover .bar{outline:1px solid var(--grid);outline-offset:3px}
  .role a:hover,.tools a:hover,.filters button:hover{outline:1px solid var(--grid);outline-offset:2px}
  /* tools: outside time, at the end of the track */
  .toolbox{position:absolute;top:34px;bottom:0;padding:14px 24px;overflow:hidden;columns:2 200px;column-gap:24px;border-left:var(--gw) solid var(--grid);background:var(--paper);z-index:2}
  .toolbox h2{margin:0 0 10px;font:900 28px/1 var(--f-display);column-span:all}
  .toolbox section{break-inside:avoid;margin-bottom:10px}
  .toolbox h4{margin:0 0 6px;font:700 11px/1 var(--f-type);letter-spacing:.12em;text-transform:uppercase}
  .tools{display:flex;flex-wrap:wrap;gap:4px;max-width:420px}
  .tools a{font:700 10px/1 var(--f-type);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);padding:4px 6px;text-decoration:none}
</style>

  </header>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".08 .9" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter><filter id="xerox"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter></svg>

<script>Stretch.make(document.getElementById('title'), 'WORK', [1], { steady: true, every: 500 });</script>
<script>
/* From "Ayelet Sella CV May2026". Contact details intentionally left out. */
const FROM = 2005, TO = 2026, NOW = 2026.85;
const L = (t, h) => [t, h];
const CATS = [['edu', 'Education'], ['edit', 'Editing & post-production'], ['rest', 'Restoration'], ['finish', 'Finishing & colour'], ['ai', 'Video & AI'], ['prize', 'Recognition']];
const R = [
  { c: 'edu', a: 2005, b: 2006, t: 'Video Editing & Broadcast Design', o: 'Jumpcut', d: 'Editing, VFX & animation school. [years to confirm]' },
  { c: 'edu', a: 2006, b: 2008, t: 'B.Des, Motion Graphics', o: 'Shenkar College of Engineering, Design and Art', d: '[years to confirm]' },
  { c: 'edu', a: 2025, b: NOW, open: true, t: 'M.Des, Design for Technology-Rich Environments', o: 'HIT, Holon Institute of Technology', d: 'In progress.', link: L('hit.ac.il', 'https://www.hit.ac.il') },
  { c: 'edit', a: 2008, b: 2009, t: 'Assistant Editor', o: '2Shot Films', d: 'Documentaries.' },
  { c: 'edit', a: 2009, b: 2018, t: 'Freelance Video Editor & Post-Production Consultant', o: 'Broadcast & agencies', d: 'Reshet, Keshet, Channel 10, Ananey, Greenhouse, Snowball Studios, McCann. From story, structure and pacing to finishing.' },
  { c: 'rest', a: 2013, b: 2013.95, t: 'Analog Film Archive Restoration', o: 'Israel PBS', d: 'Project.' },
  { c: 'rest', a: 2013.95, b: 2014.95, t: 'Digital Restoration Specialist', o: 'Realworks Studios', d: 'Frame-by-frame repair of archival film. The Decent One (2014).' },
  { c: 'finish', a: 2014, b: 2018, t: 'Conform & Color Grading', o: 'Opus Post Productions', d: 'Online conform, finishing, mastering and DCP. Abulele (2015), Sirens (2014), Absentia (2017), Survivor Israel, Gidi & Aharoni.' },
  { c: 'ai', a: 2018, b: NOW, open: true, t: 'Video Specialist', o: 'Wix.com', d: 'Quality control, workflows and delivery for editorial, marketing and educational video. AI video R&D, folding generative tools into production.', link: L('wix.com', 'https://www.wix.com') },
  { c: 'prize', a: 2025, b: 2025, point: true, t: '1st place, Design Guild AI Hackathon', o: 'Wix', d: 'Deepgram, Whisper, ComfyUI, several LLMs and video generation engines.' },
];
const TOOLS = [
  ['Generative AI', [L('Weavy', 'https://www.weavy.ai'), L('Freepik', 'https://www.freepik.com'), L('Kling', 'https://klingai.com'), L('Higgsfield', 'https://higgsfield.ai'), L('ElevenLabs', 'https://elevenlabs.io')]],
  ['Other AI', [L('Topaz Labs', 'https://www.topazlabs.com'), L('Colourlab AI', 'https://colourlab.ai'), L('Deepgram', 'https://deepgram.com'), L('Whisper', 'https://openai.com/research/whisper'), L('Claude Code & Cowork', 'https://claude.ai')]],
  ['Editing & colour', [L('Avid', 'https://www.avid.com'), L('Premiere', 'https://www.adobe.com/products/premiere.html'), L('DaVinci Resolve', 'https://www.blackmagicdesign.com/products/davinciresolve')]],
  ['Motion, 3D & design', [L('After Effects', 'https://www.adobe.com/products/aftereffects.html'), L('Cinema 4D', 'https://www.maxon.net/cinema-4d'), L('Unity', 'https://unity.com'), L('Figma', 'https://www.figma.com')]],
  ['Collaboration & dev', [L('Frame.io', 'https://frame.io'), L('monday.com', 'https://monday.com'), L('Slack', 'https://slack.com'), L('Google Workspace', 'https://workspace.google.com'), L('GitHub', 'https://github.com')]],
];
// ── the grid: one column per year; widths cycle through the gaps between the 8 birth years
const gaps = getComputedStyle(document.documentElement).getPropertyValue('--work-intervals').trim().split(/\s+/).map(parseFloat);
const years = []; for (let y = FROM; y <= TO; y++) years.push(y);
const COL = 200;                                              // classic: every year the same width
const widths = years.map(() => COL);
const starts = widths.reduce((acc, w, i) => (acc.push(i ? acc[i - 1] + widths[i - 1] : 0), acc), []);
const X = y => { const i = Math.min(years.length - 1, Math.max(0, Math.floor(y) - FROM)); return starts[i] + (y - Math.floor(y)) * widths[i]; };
const total = starts[starts.length - 1] + widths[widths.length - 1], LEFT = 240, TOOLBOX_W = 520, YEARS_H = 34;
const track = document.getElementById('track'), wrapEl = document.getElementById('wrap');
const OFF = (window.PLACEMENT && PLACEMENT.offsets) || [[0, 0]];
const face = i => { const f = Stretch.FACES[(i * 7 + 3) % Stretch.FACES.length]; return `--face:'${f.f}';--fw:${f.w};--fst:${f.s}`; };   // ransom-note titles
function build() {
  let OI = 0;
  const avail = wrapEl.clientHeight - YEARS_H, rowH = Math.max(70, Math.floor(avail / CATS.length));
  track.style.width = (LEFT + total + TOOLBOX_W) + 'px';
  let h = `<div class="years">` + years.map((y, i) => `<span style="left:${LEFT + starts[i]}px;width:${widths[i]}px">${y}</span>`).join('') + `</div>`;
  years.forEach((y, i) => h += `<div class="col" style="left:${LEFT + starts[i]}px"></div>`);
  const CENT = [];
  CATS.forEach(([k, name], ci) => {
    const items = R.filter(r => r.c === k).sort((a, b) => a.a - b.a), lanes = []; let inner = '';
    items.forEach(r => { const x0 = X(r.a); let li = lanes.findIndex(e => e <= x0); if (li < 0) { li = lanes.length; lanes.push(0); }
      lanes[li] = Math.max(r.point ? x0 + 14 : X(r.b), x0 + 280) + 12; r._lane = li; });
    const laneH = rowH / Math.max(1, lanes.length);
    items.forEach(r => {
      const x0 = X(r.a), x1 = r.point ? x0 + 10 : X(r.b);
      const when = r.point ? `${r.a}` : `${Math.floor(r.a)}${Math.floor(r.b) > Math.floor(r.a) || r.open ? '–' + (r.open ? 'now' : Math.floor(r.b)) : ''}`;
      const o = OFF[(OI++) % OFF.length], o2 = OFF[(OI * 5 + 11) % OFF.length];
      const ox = Math.round(o[0] * 340), oy = Math.round(o[1] * rowH * 1.5), rot = (o2[0] * 13).toFixed(1), sc = (1 + o2[1] * .3).toFixed(2);   // the people throw it
      CENT.push([LEFT + x0 + 110 + ox, YEARS_H + ci * rowH + 12 + r._lane * laneH + 16 + oy]);   // the pin (card top)
      inner += `<article class="role ${r.point ? 'point' : ''}" style="left:${LEFT + x0}px;width:${x1 - x0}px;top:${12 + r._lane * laneH}px;--ox:${ox}px;--oy:${oy}px;--rot:${rot}deg;--sc:${sc};--depth:${(.5 + Math.abs(o2[0]) * 1.2).toFixed(2)};z-index:${10 + (OI % 7)}">
        <div class="bar ${r.open ? 'open' : ''}"></div>
        <div class="txt"><div class="when">${when}</div><h3>${r.t}</h3><div class="org">${r.o}</div>
          <div class="more"><p>${r.d}</p>${r.link ? `<p><a href="${r.link[1]}" target="_blank" rel="noopener">${r.link[0]} ↗</a></p>` : ''}</div></div></article>`;
    });
    h += `<section class="cat" data-cat="${k}" style="height:${rowH}px"><h2>${name}<sup>${items.length}</sup></h2>${inner}</section>`;
  });
  // chaos layer: a thin red circle at each event year, polaroids of the work pinned in layers, red string pin to pin
  const W2 = LEFT + total + TOOLBOX_W, Hh = wrapEl.clientHeight;
  const rings = Rupture.YEARS.map((y, i) => { const R = Hh * [.2, .27, .17, .23, .3][i], o = OFF[(i * 9 + 4) % OFF.length], cx = LEFT + X(y + .5), cy = YEARS_H + avail * (.5 + o[1] * .22);
    return `<i class="ring" style="left:${cx - R}px;top:${cy - R}px;width:${R * 2}px;height:${R * 2}px"></i>`; }).join('');
  const pins = CENT.slice();
  const B = Board.build({ OFF, left: LEFT + 40, width: total - 80, top: YEARS_H + 10, height: avail - 20 });
  B.pins.forEach(p => pins.push(p));
  const pols = B.html;
  const str = pins.map((a, i) => [a, pins[(i * 5 + 3) % pins.length]]).filter(([a, b]) => a !== b)
    .map(([a, b], i) => Board.twine(a, b, i)).join('');
  h += `<div class="chaos">${rings}${pols}<svg class="strings" viewBox="0 0 ${W2} ${Hh}" width="${W2}" height="${Hh}">${str}</svg></div>`;
  h += `<aside class="toolbox" style="left:${LEFT + total}px;width:${TOOLBOX_W}px"><h2>Tools</h2>` +
       TOOLS.map(([g, ts]) => `<section><h4>${g}</h4><div class="tools">${ts.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join('')}</div></section>`).join('') + `</aside>`;
  track.innerHTML = h;
  const mat = Board.material(); if (mat.cork) wrapEl.style.setProperty('--cork', `url(${mat.cork})`);
}
build(); new ResizeObserver(build).observe(wrapEl);
const wrap = document.getElementById('wrap');
// to be (chaos) / not to be (the grid)
document.querySelectorAll('.views [data-v]').forEach(b => b.addEventListener('click', () => {
  const chaos = b.dataset.v === 'chaos', tr = document.getElementById('track'); if (chaos === !tr.classList.contains('grid')) return;   // already there
  document.querySelectorAll('.views [data-v]').forEach(x => x.setAttribute('aria-pressed', x === b));
  tr.classList.remove('to-grid', 'to-chaos'); void tr.offsetWidth; tr.classList.add(chaos ? 'to-chaos' : 'to-grid'); tr.classList.toggle('grid', !chaos);
}));
// layers: a little parallax on the board, by depth
wrapEl.addEventListener('pointermove', e => { const r = wrapEl.getBoundingClientRect(); const px = ((e.clientX - r.left) / r.width - .5) * -18, py = ((e.clientY - r.top) / r.height - .5) * -12;
  track.style.setProperty('--px', px.toFixed(1) + 'px'); track.style.setProperty('--py', py.toFixed(1) + 'px'); });
wrap.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { wrap.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
</script>
