<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latent Field — ayeletops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400;1,6..96,900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Zilla+Slab:ital,wght@0,300;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/grids.css"><link rel="stylesheet" href="css/site.css">
<style>
  /* LATENT FIELD — circular grid of ages stays centred; the field of words moves under it */
  .nav{grid-template-columns:repeat(4,1fr) auto auto}
  html,body{height:100%;overflow:hidden}
  #field{position:fixed;inset:calc(var(--nav-h) + var(--title-h, 124px)) 0 0 0;cursor:grab;touch-action:none;overflow:hidden}
  #field.drag{cursor:grabbing}
  .rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:1}
  .rings span{position:absolute;height:calc(var(--r) * 0.94);aspect-ratio:1;border-radius:50%;background:var(--c,var(--pink))}
  .rings i{position:absolute;inset:0;z-index:20;opacity:.35;
           background:linear-gradient(var(--ink),var(--ink)) center/1px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) center/100% 1px no-repeat}
  .layer{position:absolute;left:50%;top:50%;width:0;height:0;z-index:2}
  .layer.ease{transition:transform .8s cubic-bezier(.6,0,.2,1)}
  .w{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;cursor:pointer;user-select:none;transition:opacity .4s,font-size .4s;line-height:1}
  .w.region{font:700 13px/1 var(--f-type);text-transform:uppercase;letter-spacing:.16em}
  .w.region::before{content:"⊕ "}
  .w:hover{outline:3px solid var(--signal);outline-offset:4px}
  .w.proj{font:400 var(--s1)/1 var(--f-display);font-style:italic}
  .w.focus.proj{font-size:var(--s3);font-style:normal;background:var(--paper);padding:.08em .2em}
  .w.focus.region{font-size:var(--s1);background:var(--ink);color:var(--paper);padding:.3em .5em}
  
  /* sample panel: appears on hover / focus; click opens the whole PDF */
  .panel{position:absolute;z-index:4;width:min(34vw,420px);background:var(--paper);border:2px solid var(--ink);opacity:0;pointer-events:none;
         transition:opacity .2s;right:var(--margin-r);bottom:calc(var(--baseline)*2)}
  .panel.on{opacity:1;pointer-events:auto}
  .panel img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--ink)}
  .panel .meta{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-top:2px solid var(--ink);font:700 11px/1.3 var(--f-type);letter-spacing:.08em;text-transform:uppercase}
  .panel a{text-decoration:none}
  .panel a:hover{outline:3px solid var(--signal);outline-offset:-3px;display:block}
  .hud{position:fixed;left:var(--margin-l);bottom:var(--gutter);z-index:5;font:400 12px/18px var(--f-type)}
  .hud b{font-weight:700;text-transform:uppercase;letter-spacing:.1em}
  @media (max-width:720px){.panel{width:calc(100vw - var(--margin-l) - var(--margin-r));bottom:56px}.w.proj{font-size:var(--s0)}}
</style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <a href="index.html">Cover</a>
  <a href="field.html" aria-current="page">Latent Field</a>
  <a href="work.html">Work</a>
  <a href="holes.html">Black Holes</a>
  <span class="handle">@ayeletops</span>
  <span class="handle">sella_vie</span>
</nav>
<main>
  <header class="page-title st-row" id="title" aria-label="Latent Field" style="--fs:90"></header>
  <div id="field" aria-label="Latent field: drag to travel, click a word to centre it">
    <div class="rings"><i></i><span class="ring-1"></span><span class="ring-2"></span><span class="ring-3"></span><span class="ring-4"></span>
      <span class="ring-5"></span><span class="ring-6"></span><span class="ring-7"></span><span class="ring-8"></span></div>
    <div class="layer" id="layer"></div>
    <div class="panel" id="panel"><a id="panel-link" target="_blank" rel="noopener"><img id="panel-img" alt=""><div class="meta"><span id="panel-title"></span><span id="panel-act">open pdf ↗</span></div></a></div>
  </div>
  <p class="hud"><b>Centre:</b> <span id="centre"></span><br>drag to travel · click a word</p>
</main>
<script src="js/stretch.js"></script>
<script>Stretch.make(document.getElementById('title'),'LATENTFIELD',Stretch.weights('ages'),{every:1500});</script>
<script src="js/field.js"></script>
</body></html>
