<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Horizon — ayeletops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400;1,6..96,900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Zilla+Slab:ital,wght@0,300;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/grids.css"><link rel="stylesheet" href="css/site.css">
<style>
  /* BLACK HOLES — draft, unresolved. A 12-column year (the generic default grid) where each column is a month.
     Five events sit where birth months fall. Their meaning is encrypted; only I hand out the key. */
  .nav{grid-template-columns:repeat(12,1fr)}
  body{background:var(--ink);color:var(--paper)}
  .nav{background:var(--ink);color:var(--paper);border-bottom-color:var(--paper)}
  
  .page-head,.page-title,.page-note{background:var(--ink);color:var(--paper)}
  .page-head{position:relative;z-index:6}
  .sky{position:relative;min-height:calc(100svh - calc(var(--nav-h) + var(--title-h, 124px)));display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gutter);
       padding:var(--gutter) var(--margin-r) var(--gutter) var(--margin-l)}
  .sky .m{grid-row:1 / 3;border-left:1px solid var(--grid);font:700 10px/1 var(--f-type);letter-spacing:.1em;padding:6px 0 0 6px;color:rgba(255,255,255,.4)}
  .hole{grid-row:1;grid-column:var(--col);align-self:center;justify-self:center;position:relative;border:0;padding:0;cursor:pointer;
        width:calc(var(--size) * 1.5vw + 40px);aspect-ratio:1;border-radius:50%;background:#000;
        box-shadow:0 0 0 1px #fff;
        transition:transform .6s cubic-bezier(.6,0,.2,1)}
  .hole:nth-of-type(even){grid-row:2}
  .hole:hover,.hole:focus-visible{transform:scale(1.08);outline:1px solid var(--grid);outline-offset:6px}
  .hole span{position:absolute;inset:0;display:grid;place-items:center;font:700 10px/1 var(--f-type);letter-spacing:.12em;color:rgba(255,255,255,.5)}
  .lock{position:fixed;left:50%;bottom:calc(var(--baseline)*2);transform:translateX(-50%);z-index:10;width:min(92vw,520px);background:var(--paper);color:var(--ink);
        border:2px solid var(--paper);padding:16px;display:none}
  .lock.on{display:block}
  .lock p{margin:0 0 10px}
  .lock form{display:flex;gap:8px}
  .lock input{flex:1;font:400 15px/1 var(--f-type);border:2px solid var(--ink);padding:8px}
  .lock button{font:700 11px/1 var(--f-type);letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:0;padding:0 14px;cursor:pointer}
  .lock .out{margin-top:10px;font-size:13px}
  .intro{position:fixed;left:var(--margin-l);bottom:var(--gutter);font:400 12px/18px var(--f-type);color:rgba(255,255,255,.7);max-width:44ch}
  @media (max-width:720px){.sky{grid-template-columns:repeat(4,1fr)}.sky .m{display:none}.hole{grid-column:auto!important;grid-row:auto!important}}
</style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <a href="index.html" style="grid-column:span 2">Home</a>
  <a href="roi.html" style="grid-column:span 2">ROI</a>
  <a href="work.html" style="grid-column:span 2">Work</a>
  <span></span><span></span>
  <a href="horizon.html" aria-current="page" style="grid-column:span 3">Event Horizon</a>
</nav>
<main>
  <header class="page-head">
    <div class="page-title st-row" id="title" aria-label="Event Horizon" style="--fs:90"></div>
    <p class="page-note">Event Horizon: five events that bent everything around them. Twelve letters, twelve red months. Their meaning is encrypted. If I gave you a key, enter it. <span class="todo" style="outline-color:#fff">[draft line · page unresolved]</span></p>
  </header>
  <section class="sky" id="sky" aria-label="Five encrypted events"></section>
  <div class="lock" id="lock" role="dialog" aria-label="Decrypt">
    <p class="label" id="lock-n"></p>
    <form id="lock-f"><input id="lock-k" type="password" autocomplete="off" placeholder="key"><button>Open</button></form>
    <div class="out" id="lock-out"></div>
  </div>
</main>
<script src="js/stretch.js"></script>
<script>Stretch.make(document.getElementById('title'),'EVENTHORIZON',Stretch.weights('months'),{every:1500,color:'#ffffff'});</script>
<script src="js/holes-data.js"></script>
<script src="js/holes.js"></script>
</body></html>
