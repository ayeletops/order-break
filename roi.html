<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROI — ayeletops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400;1,6..96,900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Zilla+Slab:ital,wght@0,300;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/grids.css"><link rel="stylesheet" href="css/site.css">
<style>
  /* ROI — a vast latent field. Every dot carries its own target grid (8 rings = the ages of the people I love).
     The rings breathe. The dot nearest the centre is chosen: its target grows into the big grid. */
  .nav{grid-template-columns:repeat(4,1fr)}
  html,body{height:100%;overflow:hidden}
  #field{position:fixed;left:0;right:0;top:var(--content-top, 240px);bottom:0;cursor:grab;touch-action:none;overflow:hidden;user-select:none}
  #field.drag{cursor:grabbing}
  .cross{position:absolute;inset:0;pointer-events:none;z-index:0;
         background:linear-gradient(var(--grid),var(--grid)) center/var(--gw) 100% no-repeat,linear-gradient(var(--grid),var(--grid)) center/100% var(--gw) no-repeat;opacity:.5}
  .layer{position:absolute;left:50%;top:50%;width:0;height:0;z-index:2;will-change:transform}
  .links{position:absolute;left:-3000px;top:-2000px;width:6000px;height:4000px;overflow:visible;pointer-events:none}
  .links line,.links polyline,.links path{stroke:var(--ink);vector-effect:non-scaling-stroke;stroke-width:.5}
  .links .tree{stroke-opacity:.35}
  .links .rhizome{stroke:var(--grid);stroke-opacity:.6;stroke-dasharray:2 3}
  /* node: dot + its own target + label */
  .n{position:absolute;width:0;height:0}
  .n .tg{position:absolute;left:0;top:0;width:var(--ts);height:var(--ts);transform:translate(-50%,-50%);pointer-events:none;
         transition:width .9s cubic-bezier(.2,.8,.2,1),height .9s cubic-bezier(.2,.8,.2,1),opacity .6s}
  .n .tg i{position:absolute;left:50%;top:50%;width:calc(var(--r) * 1);aspect-ratio:1;border:var(--gw) solid var(--grid);border-radius:50%;
           transform:translate(-50%,-50%);animation:breathe var(--dur,6s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
  @keyframes breathe{from{transform:translate(-50%,-50%) scale(.9)}to{transform:translate(-50%,-50%) scale(1.06)}}
  .n .dt{position:absolute;left:0;top:0;width:var(--ds);height:var(--ds);transform:translate(-50%,-50%);border-radius:50%;background:var(--ink);cursor:pointer;border:0;padding:0}
  .n .lb{position:absolute;left:calc(var(--ds) / 2 + 8px);top:0;transform:translateY(-50%);white-space:nowrap;cursor:help;line-height:1;font-family:var(--f-display);font-weight:400}
  .n.lv0{--ds:12px;--ts:150px}.n.lv0 .lb{font-size:54px;font-weight:900;letter-spacing:-.02em}
  .n.lv05{--ds:9px;--ts:96px}.n.lv05 .lb{font-size:22px;font-style:italic}
  .n.lv1{--ds:8px;--ts:70px}.n.lv1 .lb{font-size:20px;font-weight:700}
  .n.lv2{--ds:5px;--ts:34px}.n.lv2 .lb{font-size:14px}.n.lv2:not(.focus) .tg{opacity:.28}
  .n.proj{--ds:20px;--ts:120px}.n.proj .dt{background:var(--grid)}
  .n.proj .lb{font:700 13px/1.2 var(--f-slab);letter-spacing:.06em;cursor:pointer;left:auto;right:calc(var(--ds) / 2 + 8px);text-align:right}
  .n.proj .lb b{display:block;font:700 22px/1 var(--f-slab);letter-spacing:0}
  .n.focus{--ts:min(78vh,78vw);z-index:3}
  .n.focus .lb{background:var(--paper);padding:3px 6px}
  .n .dt:hover,.n .lb:hover{outline:var(--gw) solid var(--grid);outline-offset:4px}
  /* dictionary pop-up */
  .def{position:absolute;z-index:9;width:300px;padding:10px 12px;background:var(--paper);border:var(--gw) solid var(--ink);opacity:0;transform:translateY(-4px);
       pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1)}
  .def.on{opacity:1;transform:none}
  .def b{font:400 20px/1.1 var(--f-display)}
  .def i{font:400 italic 13px/1 var(--f-display);margin-left:4px}
  .def span{display:block;margin-top:6px;font:400 12px/17px var(--f-type)}
  /* thumbnail card: eases in from the dot */
  .card{position:absolute;z-index:8;background:var(--paper);border:var(--gw) solid var(--ink);cursor:pointer;opacity:0;transform:scale(.4);pointer-events:none;
        transition:opacity .35s cubic-bezier(.2,.7,.2,1),transform .45s cubic-bezier(.2,.8,.2,1)}
  .card.on{opacity:1;transform:scale(1);pointer-events:auto}
  .card:hover{outline:var(--gw) solid var(--grid);outline-offset:4px}
  .card .media{aspect-ratio:4/3;overflow:hidden;border-bottom:var(--gw) solid var(--ink)}
  .card .media img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);transform:scale(1.06);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
  .card.on .media img{transform:scale(1)}
  .card .media .type{--fs:999;height:100%;padding:10px;display:flex;flex-wrap:nowrap;gap:6px}
  .card .media .type .st-slot{height:100%;flex-basis:0}
  .card .cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 12px 2px}
  .card h3{margin:0;font:900 22px/1.05 var(--f-display)}
  .card .yr{font:700 13px/1 var(--f-type);letter-spacing:.06em}
  .card .sub{padding:4px 12px 12px;font:400 11px/1.4 var(--f-type);letter-spacing:.04em;text-transform:uppercase}
  /* gallery: a window, not the whole screen */
  .gallery{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(255,255,255,.55);opacity:0;transition:opacity .3s}
  .gallery.on{opacity:1}
  .gallery .win{width:min(860px,88vw);height:min(640px,78vh);background:var(--paper);border:var(--gw) solid var(--ink);display:grid;grid-template-rows:auto 1fr auto;
                transform:scale(.96);transition:transform .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 100vmax rgba(255,255,255,0)}
  .gallery.on .win{transform:none}
  .gallery header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:var(--gw) solid var(--ink)}
  .gallery h2{margin:0;font:900 22px/1 var(--f-display)}
  .gallery .stage{display:grid;place-items:center;overflow:hidden;padding:14px;min-height:0}
  .gallery img{max-width:100%;max-height:100%;object-fit:contain;filter:grayscale(1);cursor:e-resize;opacity:0;transform:translateY(10px);transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
  .gallery img.in{opacity:1;transform:none}
  .gallery footer{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-top:var(--gw) solid var(--ink);font:700 11px/1 var(--f-type);letter-spacing:.1em;text-transform:uppercase}
  .gallery button,.gallery a{font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:var(--gw) solid var(--ink);padding:6px 10px;cursor:pointer;color:var(--ink);text-decoration:none}
  .gallery button:hover,.gallery a:hover{outline:var(--gw) solid var(--grid);outline-offset:2px}
  .hud{position:fixed;left:var(--margin-l);bottom:var(--gutter);z-index:5;margin:0;font:400 12px/18px var(--f-type);background:var(--paper);padding:2px 6px}
  .hud b{font-weight:700;text-transform:uppercase;letter-spacing:.1em}
  .zoom{position:fixed;right:var(--margin-r);bottom:var(--gutter);z-index:5;display:flex;gap:6px}
  .zoom button{font:700 14px/1 var(--f-type);width:32px;height:32px;border:var(--gw) solid var(--ink);background:var(--paper);cursor:pointer}
  .zoom button:hover{outline:var(--gw) solid var(--grid);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.n .tg i{animation:none}}
</style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <a href="index.html">Home</a>
  <a href="roi.html" aria-current="page">ROI</a>
  <a href="work.html">Work</a>
  <a href="horizon.html">Event Horizon</a>
</nav>
<a class="secret" href="process.html" aria-label="Process" title="process"></a>
<main>
  <header class="page-head">
    <div class="page-title st-row" id="title" aria-label="ROI"></div>
    <p class="page-note">A latent field of what I think about. Hover a word for its meaning. Red points are projects. Drag to travel, scroll to zoom.</p>
  </header>
  <div id="field" aria-label="Field: drag to travel, click a point to centre it">
    <div class="cross"></div>
    <div class="layer" id="layer"></div>
    <div class="card" id="card"></div>
    <div class="def" id="def" role="tooltip"></div>
  </div>
  <p class="hud"><b>Centre:</b> <span id="centre"></span></p>
  <div class="zoom"><button data-zoom="1.4" aria-label="Zoom in">+</button><button data-zoom="0.7" aria-label="Zoom out">−</button></div>
</main>
<div class="gallery" id="gallery" hidden role="dialog" aria-label="Project gallery">
  <div class="win">
    <header><h2 id="g-title"></h2><div><a id="g-pdf" target="_blank" rel="noopener">PDF ↗</a> <button id="g-close" aria-label="Close">×</button></div></header>
    <div class="stage"><img id="g-img" alt=""></div>
    <footer><button id="g-prev">← prev</button><span id="g-n"></span><button id="g-next">next →</button></footer>
  </div>
</div>
<script src="js/stretch.js"></script>
<script>Stretch.make(document.getElementById('title'), 'ROI', Stretch.weights('ages'), { steady: true, every: 1500 });</script>
<script src="js/roi-dict.js"></script>
<script src="js/roi.js"></script>
</body></html>
